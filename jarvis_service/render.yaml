# PROPOSED PAID INFRASTRUCTURE. Do not apply until the owner approves provider costs.
# Blueprint path: jarvis_service/render.yaml. Branch: jarvis/personal-assistant.
services:
  - type: web
    name: aaron-jarvis
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: jarvis/personal-assistant
    numInstances: 1
    dockerfilePath: ./jarvis_service/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: jarvis-private-state
      mountPath: /var/lib/jarvis
      sizeGB: 1
    envVars:
      - key: OWNER_TOKEN
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_ALLOWED_EMAIL
        value: c29ak@dalton.org
      - key: DATA_DIR
        value: /var/lib/jarvis
      - key: OPENJARVIS_HOME
        value: /var/lib/jarvis/openjarvis
      - key: MONITOR_SECONDS
        value: "300"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: TEXT_MODEL
        value: gpt-4o-mini
      - key: VOICE_MODEL
        value: gpt-realtime
# Add optional OPENAI_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
# TWILIO_PHONE_NUMBER privately after provider accounts and charges are approved.

# Google OAuth client ID and secret are added privately after initial deployment.
# PUBLIC_URL defaults to Render's documented RENDER_EXTERNAL_URL.
