name: Jarvis integration and security contracts
on:
  push:
    branches: ["jarvis/personal-assistant"]
    paths: ["jarvis_service/**", ".github/workflows/jarvis-tests.yml"]
  pull_request:
    paths: ["jarvis_service/**", ".github/workflows/jarvis-tests.yml"]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis_service/requirements.txt
      - name: Install official pinned OpenJarvis and integration dependencies
        run: pip install -r jarvis_service/requirements.txt
      - name: Dependency compatibility
        run: pip check
      - name: Compile service
        run: python -m compileall -q jarvis_service
      - name: Offline integration and security contracts
        run: python -m pytest -q jarvis_service/tests
      - name: Validate deployment blueprint syntax
        run: python -c "import yaml; x=yaml.safe_load(open('jarvis_service/render.yaml')); assert x['services'][0]['numInstances']==1; assert x['services'][0]['disk']['mountPath']=='/var/lib/jarvis'"
