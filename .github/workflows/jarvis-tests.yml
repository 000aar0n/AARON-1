name: Jarvis integration and security contracts
on:
  pull_request:
    paths: ["jarvis_service/**", ".github/workflows/jarvis-tests.yml"]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis_service/requirements.txt
      - name: Install official pinned OpenJarvis and integration dependencies
        run: pip install -r jarvis_service/requirements.txt
      - name: Dependency compatibility
        run: pip check
      - name: Compile service
        run: python -m compileall -q jarvis_service
      - name: Offline integration and security contracts
        run: python -m pytest -q jarvis_service/tests
      - name: Validate deployment blueprint syntax
        run: python -c "import yaml; x=yaml.safe_load(open('jarvis_service/render.yaml')); assert x['services'][0]['numInstances']==1; assert x['services'][0]['disk']['mountPath']=='/var/lib/jarvis'"
      - name: Check browser script syntax
        run: |
          node --check jarvis_service/ui.js
          node --check jarvis_service/speech.js
          node --test jarvis_service/tests/speech.test.cjs
      - name: Install browser test tooling
        run: pip install 'playwright>=1.55,<2'
      - name: Install Chromium for the setup flow test
        run: python -m playwright install --with-deps chromium
      - name: Test real browser login and private setup
        run: python jarvis_service/tests/browser_setup.py
      - name: Build deployable container
        run: docker build -f jarvis_service/Dockerfile -t jarvis-ci .
      - name: Test container health, privilege drop and persistence
        run: python jarvis_service/tests/container_smoke.py
