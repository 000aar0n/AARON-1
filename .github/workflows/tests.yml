name: Verify AARON-1
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py assistant_core.py gmail_access.py avatar.py test_assistant.py planner.py planner_ui.py assistant_conversation.py test_planner.py
      - name: Run offline regression tests
        run: python -m unittest -v test_assistant.py test_planner.py
